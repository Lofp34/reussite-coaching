<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>MVP Prise de Notes</title>

  <!-- Lien Bootstrap 5 (CDN) -->
  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  >

  <style>
    body {
      margin: 20px;
      background-color: #f8f9fa;
    }

    .card-header {
      cursor: pointer;
    }

    .subcard {
      margin-left: 2rem;
      border-left: 2px solid #ddd;
      padding-left: 1rem;
    }

    .notes-textarea {
      width: 100%;
      height: 100px;
      resize: vertical;
    }

    .bottom-section {
      margin-top: 1rem;
    }

    .gemini-section {
      border-top: 1px solid #ccc;
      margin-top: 1rem;
      padding-top: 1rem;
    }

    .btn-actions {
      margin: 0.3rem;
    }

    .spinner-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .spinner-content {
      text-align: center;
      color: white;
    }

    .modal-lg {
      max-width: 800px;
    }

    .modal-body {
      white-space: pre-wrap;
      max-height: 70vh;
      overflow-y: auto;
    }

    /* Styles pour le Markdown dans le modal */
    .markdown-body h3 {
      color: #0d6efd;
      border-bottom: 2px solid #0d6efd;
      padding-bottom: 0.5rem;
      margin-top: 1.5rem;
      margin-bottom: 1rem;
    }

    .markdown-body h4 {
      color: #198754;
      margin-top: 1.2rem;
      margin-bottom: 0.8rem;
    }

    .markdown-body ul, .markdown-body ol {
      padding-left: 1.5rem;
      margin-bottom: 1rem;
    }

    .markdown-body li {
      margin-bottom: 0.5rem;
    }

    .markdown-body p {
      margin-bottom: 1rem;
      line-height: 1.6;
    }

    .modal-body.markdown-body {
      padding: 1.5rem;
      font-size: 1rem;
      line-height: 1.6;
      color: #212529;
    }

    .markdown-body strong {
      color: #0d6efd;
    }
  </style>
</head>
<body>

<div class="container">
  <h1 class="my-4">Découverte du Cabinet (MVP)</h1>

  <!-- Conteneur principal des cartes -->
  <div id="cardsContainer" class="accordion"></div>

  <!-- Zone de notes globales -->
  <div class="mb-3 mt-4">
    <label for="globalNotes" class="form-label fw-bold">Prendre des Notes</label>
    <textarea id="globalNotes" class="form-control" rows="4"
              placeholder="Vos notes globales ici..."></textarea>
  </div>

  <!-- Boutons actions -->
  <div class="d-flex flex-wrap bottom-section">
    <button class="btn btn-secondary btn-actions" id="resetBtn">Réinitialiser la découverte</button>
    <button class="btn btn-success btn-actions" id="synthBtn">Synthétiser la découverte</button>
    <button class="btn btn-info text-white btn-actions" id="mailBtn">Créer un email de suivi</button>
    <button class="btn btn-outline-primary btn-actions" id="copyBtn">Copier</button>
  </div>

  <!-- Spinner de chargement -->
  <div class="spinner-overlay" id="loadingSpinner">
    <div class="spinner-content">
      <div class="spinner-border text-light mb-2" role="status">
        <span class="visually-hidden">Chargement...</span>
      </div>
      <div>Traitement en cours...</div>
    </div>
  </div>

  <!-- Modal pour la synthèse -->
  <div class="modal fade" id="synthesisModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Synthèse de la découverte</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body markdown-body" id="synthesisContent"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="copySynthesis">Copier</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script>
  // Données de cartes
  const cardsData = [
    {
      title: "1. Des nouvelles de l'élève",
      isOpen: false,
      notes: "",
      subCards: [
        {
          title: "Santé et Bien-être",
          isOpen: false,
          content: [ "Comment va l'élève ?" ]
        }
      ]
    },
    {
      title: "2. Élève Collège/Lycée",
      isOpen: false,
      notes: "",
      subCards: [
        {
          title: "Début et Fin d'Année",
          isOpen: false,
          content: [
            "Début d'année : comment s'est passée la rentrée ?",
            "Fin d'année : comment s'est passée cette année (on envisage des cours pour l'été si besoin)",
            "Comment s'est passée l'adaptation Primaire/Collège & Collège/Lycée ?"
          ]
        }
      ]
    },
    {
      title: "4. Prof Réussite",
      isOpen: false,
      notes: "",
      subCards: [
        {
          title: "Cours avec le Professeur",
          isOpen: false,
          content: [
            "Comment se passent les cours avec le prof déjà en place ? Le feeling est OK ?"
          ]
        }
      ]
    },
    {
      title: "5. Ambiance à la Maison",
      isOpen: false,
      notes: "",
      subCards: [
        {
          title: "Devoirs et Relations",
          isOpen: false,
          content: [
            "Comment les devoirs se passent à la maison ?",
            "Comment décririez-vous les relations avec X aujourd'hui ?",
            "Quand / comment arrivez-vous à passer du temps de qualité avec X ? (temps de qualité : qui ne crée pas de conflits, où l'on fait autre chose que les devoirs, etc.)",
            "Comment a évolué l'ambiance depuis le début des cours particuliers ?"
          ]
        }
      ]
    },
    {
      title: "6. Méthode et Organisation",
      isOpen: false,
      notes: "",
      subCards: [
        {
          title: "Méthode de Travail",
          isOpen: false,
          content: [
            "Quel est son niveau de méthode de travail et d'organisation (creuser si besoin)",
            "Comment s'organise X pour préparer le Brevet/bac : sentez-vous du stress ?"
          ]
        }
      ]
    },
    {
      title: "7. Autres Membres de la Famille",
      isOpen: false,
      notes: "",
      subCards: [
        {
          title: "Frères et Sœurs",
          isOpen: false,
          content: [
            "Pouvez-vous me rappeler, X a des frères et sœurs ?",
            "Quel âge ?",
            "Quelle classe ?",
            "Comment ça se passe pour eux ?"
          ]
        }
      ]
    },
    {
      title: "8. Motivation",
      isOpen: false,
      notes: "",
      subCards: [
        {
          title: "Évaluation de la Motivation",
          isOpen: false,
          content: [
            "À combien évalueriez-vous la motivation de X sur 10 ?"
          ]
        }
      ]
    }
  ];

  // Récupération de l'état depuis localStorage s'il existe
  function loadDataFromStorage() {
    const savedData = localStorage.getItem("cardsData");
    if (savedData) {
      return JSON.parse(savedData);
    } else {
      return cardsData;
    }
  }

  // Sauvegarde dans localStorage
  function saveDataToStorage(data) {
    localStorage.setItem("cardsData", JSON.stringify(data));
  }

  // Récupération des notes globales
  function loadGlobalNotes() {
    return localStorage.getItem("globalNotes") || "";
  }

  function saveGlobalNotes(text) {
    localStorage.setItem("globalNotes", text);
  }

  // Génération du HTML
  const container = document.getElementById("cardsContainer");
  let loadedCards = loadDataFromStorage();
  loadedCards.forEach((card, index) => {
    container.appendChild(createCard(card, index));
  });

  // Initialisation de la zone de notes globales
  const globalNotesArea = document.getElementById("globalNotes");
  globalNotesArea.value = loadGlobalNotes();

  // Ajout d'événements
  globalNotesArea.addEventListener("input", (e) => {
    saveGlobalNotes(e.target.value);
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Êtes-vous sûr(e) de vouloir tout réinitialiser ?")) {
      localStorage.removeItem("cardsData");
      localStorage.removeItem("globalNotes");
      window.location.reload();
    }
  });

  document.getElementById("synthBtn").addEventListener("click", () => {
    synthesizeDiscovery();
  });

  document.getElementById("mailBtn").addEventListener("click", () => {
    createFollowUpEmail();
  });

  document.getElementById("copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(globalNotesArea.value)
      .then(() => alert("Notes copiées !"))
      .catch(err => console.error("Erreur de copie : ", err));
  });

  // Fonction qui crée la carte principale
  function createCard(cardData, cardIndex) {
    // Card container
    const cardDiv = document.createElement("div");
    cardDiv.className = "card mb-2";

    // Card header
    const headerDiv = document.createElement("div");
    headerDiv.className = "card-header";
    headerDiv.textContent = cardData.title;
    headerDiv.addEventListener("click", () => {
      cardData.isOpen = !cardData.isOpen;
      saveDataToStorage(loadedCards);
      bodyDiv.style.display = cardData.isOpen ? "block" : "none";
    });

    // Card body
    const bodyDiv = document.createElement("div");
    bodyDiv.className = "card-body";
    bodyDiv.style.display = cardData.isOpen ? "block" : "none";

    // Sous-cartes
    cardData.subCards.forEach((sub, subIndex) => {
      bodyDiv.appendChild(createSubCard(sub, cardIndex, subIndex));
    });

    // Notes pour la carte principale
    const notesLabel = document.createElement("label");
    notesLabel.textContent = "Notes pour " + cardData.title + " :";
    notesLabel.className = "form-label fw-bold mt-3";

    const notesArea = document.createElement("textarea");
    notesArea.className = "form-control mb-2 notes-textarea";
    notesArea.value = cardData.notes || "";
    notesArea.addEventListener("input", (e) => {
      cardData.notes = e.target.value;
      saveDataToStorage(loadedCards);
    });

    bodyDiv.appendChild(notesLabel);
    bodyDiv.appendChild(notesArea);

    cardDiv.appendChild(headerDiv);
    cardDiv.appendChild(bodyDiv);

    return cardDiv;
  }

  // Fonction qui crée une sous-carte
  function createSubCard(subCardData, cardIndex, subIndex) {
    const subCardDiv = document.createElement("div");
    subCardDiv.className = "subcard";

    // Titre sous-carte
    const subTitle = document.createElement("h5");
    subTitle.textContent = subCardData.title;
    subTitle.className = "mt-3";
    subTitle.style.cursor = "pointer";
    subTitle.addEventListener("click", () => {
      subCardData.isOpen = !subCardData.isOpen;
      saveDataToStorage(loadedCards);
      subContentDiv.style.display = subCardData.isOpen ? "block" : "none";
    });

    const subContentDiv = document.createElement("div");
    subContentDiv.style.display = subCardData.isOpen ? "block" : "none";

    // Contenu
    subCardData.content.forEach(item => {
      const p = document.createElement("p");
      p.textContent = item;
      subContentDiv.appendChild(p);
    });

    subCardDiv.appendChild(subTitle);
    subCardDiv.appendChild(subContentDiv);

    return subCardDiv;
  }

  // Fonction utilitaire pour afficher/masquer le spinner
  function toggleSpinner(show) {
    document.getElementById('loadingSpinner').style.display = show ? 'flex' : 'none';
  }

  // Fonction pour convertir le Markdown en HTML
  function markdownToHtml(markdown) {
    return markdown
      // Titres
      .replace(/### (.*)/g, '<h3>$1</h3>')
      .replace(/#### (.*)/g, '<h4>$1</h4>')
      // Listes
      .replace(/^\d+\. (.*)/gm, '<li>$1</li>')
      .replace(/^- (.*)/gm, '<li>$1</li>')
      // Gras
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      // Paragraphes
      .replace(/\n\n/g, '</p><p>')
      // Wrap des listes
      .replace(/(<li>.*<\/li>)\n(<li>)/g, '$1$2')
      .replace(/(<li>.*<\/li>)+/g, '<ul>$&</ul>')
      // Nettoyage final
      .replace(/<\/ul>\n<ul>/g, '\n')
      .replace(/^(.+?)(?=<h3>|$)/s, '<p>$1</p>');
  }

  // Mise à jour de la fonction d'affichage de la synthèse
  function displayInModal(content, title) {
    const modalTitle = document.getElementById('modalTitle');
    const synthesisContent = document.getElementById('synthesisContent');
    
    modalTitle.textContent = title;
    synthesisContent.innerHTML = markdownToHtml(content);
    
    new bootstrap.Modal(document.getElementById('synthesisModal')).show();
  }

  // Fonction de synthèse avec OpenAI
  async function synthesizeDiscovery() {
    // Vérification de la clé API
    if (!OPENAI_API_KEY) {
      if (!setApiKey()) {
        alert("Une clé API OpenAI est nécessaire pour utiliser cette fonctionnalité.");
        return;
      }
    }

    toggleSpinner(true);

    try {
      const context = getNotesContext();
      const systemPrompt = `Tu es un expert en analyse pédagogique spécialisé dans la synthèse de découvertes avec des élèves et leurs familles.
Tu dois produire une synthèse structurée et professionnelle qui suit exactement ce format :

### Synthèse de la Découverte avec l'Élève et sa Famille

#### 1. État général de l'élève
[Points clés sur l'état général, le bien-être et la situation actuelle]

#### 2. Matières et intérêts
[Analyse des matières fortes/faibles et centres d'intérêt]

#### 3. Relation avec le professeur
[Évaluation de la relation pédagogique]

#### 4. Ambiance familiale
[Analyse du contexte familial et du soutien]

#### 5. Méthodes de travail et organisation
[Évaluation des méthodes et de l'organisation]

#### 6. Soutien familial
[Analyse du soutien familial disponible]

#### 7. Motivation
[Évaluation du niveau de motivation]

### Recommandations Actionnables
[Liste numérotée de 3 à 5 recommandations concrètes et réalisables]`;

      const userPrompt = `Voici les notes d'une découverte avec un élève et sa famille. Analyse ces notes et produis une synthèse structurée qui met en avant les points clés et propose des recommandations actionnables.\n\n${context}`;

      const response = await fetch(OPENAI_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${OPENAI_API_KEY}`
        },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: [
            {
              role: "system",
              content: systemPrompt
            },
            {
              role: "user",
              content: userPrompt
            }
          ],
          temperature: 0.7
        })
      });

      if (!response.ok) {
        if (response.status === 401) {
          localStorage.removeItem('OPENAI_API_KEY');
          OPENAI_API_KEY = '';
          throw new Error('Clé API invalide. Veuillez vérifier votre clé et réessayer.');
        }
        throw new Error(`Erreur API (${response.status}): ${await response.text()}`);
      }

      const data = await response.json();
      
      if (data.choices && data.choices[0]) {
        const synthesis = data.choices[0].message.content;
        displayInModal(synthesis, 'Synthèse de la découverte');
      } else {
        throw new Error('Réponse invalide de l\'API');
      }
    } catch (error) {
      console.error("Erreur lors de la synthèse:", error);
      alert(`Erreur lors de la génération de la synthèse: ${error.message}`);
    } finally {
      toggleSpinner(false);
    }
  }

  // Fonction pour créer l'email de suivi
  async function createFollowUpEmail() {
    if (!OPENAI_API_KEY) {
      if (!setApiKey()) {
        alert("Une clé API OpenAI est nécessaire pour utiliser cette fonctionnalité.");
        return;
      }
    }

    toggleSpinner(true);

    try {
      const context = getNotesContext();
      const systemPrompt = `Tu es un expert en communication client pour une société de coaching scolaire.
Tu dois rédiger un email de suivi court, professionnel et chaleureux pour résumer une séance de découverte avec des parents d'élève.

Règles importantes :
1. L'email doit être concis (maximum 15 lignes)
2. Le ton doit être professionnel mais chaleureux
3. Utiliser "vous" et non "tu"
4. Inclure :
   - Un remerciement pour le temps accordé
   - Un bref résumé des points clés discutés
   - Une ou deux recommandations concrètes
   - Une proposition de suite
5. Terminer par une formule de politesse appropriée

Format de l'email :
Objet : Synthèse de notre échange - Découverte [Réussite]

Chers parents,

[Corps de l'email]

[Formule de politesse]
[Signature]`;

      const userPrompt = `Voici les notes de la découverte avec la famille. Rédige un email de suivi professionnel et sympathique en suivant le format spécifié.\n\n${context}`;

      const response = await fetch(OPENAI_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${OPENAI_API_KEY}`
        },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: [
            {
              role: "system",
              content: systemPrompt
            },
            {
              role: "user",
              content: userPrompt
            }
          ],
          temperature: 0.7
        })
      });

      if (!response.ok) {
        if (response.status === 401) {
          localStorage.removeItem('OPENAI_API_KEY');
          OPENAI_API_KEY = '';
          throw new Error('Clé API invalide. Veuillez vérifier votre clé et réessayer.');
        }
        throw new Error(`Erreur API (${response.status}): ${await response.text()}`);
      }

      const data = await response.json();
      if (data.choices && data.choices[0]) {
        const email = data.choices[0].message.content;
        displayInModal(email, 'Email de suivi');
      } else {
        throw new Error('Réponse invalide de l\'API');
      }
    } catch (error) {
      console.error("Erreur lors de la création de l'email:", error);
      alert(`Erreur: ${error.message}`);
    } finally {
      toggleSpinner(false);
    }
  }

  // Fonction pour obtenir le contexte des notes
  function getNotesContext() {
    const globalNotes = localStorage.getItem("globalNotes") || "";
    const cardsData = JSON.parse(localStorage.getItem("cardsData") || "[]");
    
    let context = "";
    if (globalNotes) {
      context += "Notes globales:\n" + globalNotes + "\n\n";
    }
    
    cardsData.forEach(card => {
      if (card.notes) {
        context += `${card.title}:\n${card.notes}\n\n`;
      }
    });

    return context;
  }

  // Configuration OpenAI
  let OPENAI_API_KEY = localStorage.getItem('OPENAI_API_KEY') || '';
  const OPENAI_API_URL = 'https://api.openai.com/v1/chat/completions';

  // Fonction pour définir la clé API
  function setApiKey() {
    const key = prompt("Veuillez entrer votre clé API OpenAI:");
    if (key) {
      OPENAI_API_KEY = key;
      localStorage.setItem('OPENAI_API_KEY', key);
      return true;
    }
    return false;
  }

  // Event listeners pour les nouveaux boutons
  document.getElementById("mailBtn").addEventListener("click", createFollowUpEmail);
  document.getElementById("copySynthesis").addEventListener("click", () => {
    const content = document.getElementById('synthesisContent').textContent;
    navigator.clipboard.writeText(content)
      .then(() => alert("Contenu copié !"))
      .catch(err => console.error("Erreur de copie : ", err));
  });
</script>

<!-- JS Bootstrap 5 (CDN) -->
<script 
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
